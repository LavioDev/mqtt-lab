name: mqtt-lab

x-client: &client
  image: mqtt-lab-client:phase1
  build:
    context: .
    dockerfile: lab_clients/Dockerfile
  env_file: .env
  environment:
    MQTT_HOST: broker
    MQTT_PORT: "1883"
    RUN_ID: ${RUN_ID:-manual}
  volumes:
    - ./data/raw:/artifacts
  networks:
    - lab
  depends_on:
    - broker
  user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
  read_only: true
  tmpfs:
    - /tmp

services:
  broker:
    image: eclipse-mosquitto:2.1.2-alpine
    volumes:
      - ./config/mosquitto:/mosquitto/config:ro
    networks:
      - lab
    security_opt:
      - no-new-privileges:true

  subscriber:
    <<: *client
    command: ["python", "-m", "lab_clients.subscriber"]

  test_client:
    <<: *client
    volumes: []
    command: ["python", "-m", "lab_clients.test_client", "probe"]

  capture:
    build:
      context: ./capture
    image: mqtt-lab-capture:phase1
    network_mode: service:broker
    depends_on:
      - broker
    environment:
      RUN_ID: ${RUN_ID:-manual}
    volumes:
      - ./data/raw:/artifacts
    cap_drop:
      - ALL
    cap_add:
      - NET_RAW
      - DAC_OVERRIDE
    security_opt:
      - no-new-privileges:true
    command:
      - sh
      - -c
      - exec tcpdump -i eth0 -p -Z root -s 0 -U -w "/artifacts/$${RUN_ID}/baseline.pcap" 'tcp port 1883'

  dashboard:
    profiles: [dashboard]
    build:
      context: .
      dockerfile: dashboard/Dockerfile
    image: mqtt-lab-dashboard:phase1
    environment:
      MQTT_HOST: broker
      MQTT_PORT: "1883"
      MQTT_USERNAME: ${MONITOR_USERNAME:-monitor}
      MQTT_PASSWORD: ${MONITOR_PASSWORD:?Run python3 scripts/init_lab.py first}
    networks:
      - lab
    depends_on:
      - broker
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  dashboard_proxy:
    profiles: [dashboard]
    image: nginx:1.27-alpine
    ports:
      - "127.0.0.1:${DASHBOARD_PORT:-8081}:8080"
    volumes:
      - ./dashboard/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - lab
      - dashboard_edge
    depends_on:
      - dashboard
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

networks:
  lab:
    internal: true
  dashboard_edge: {}

