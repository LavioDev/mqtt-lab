name: mqtt-lab

x-client: &client
  image: mqtt-lab-client:phase1
  build:
    context: .
    dockerfile: docker/lab-client/Dockerfile
  # Explicit vars (not env_file) so nested compose from the tools container resolves them via --env-file.
  environment:
    SENSOR_USERNAME: ${SENSOR_USERNAME:-}
    SENSOR_PASSWORD: ${SENSOR_PASSWORD:-}
    SUBSCRIBER_USERNAME: ${SUBSCRIBER_USERNAME:-}
    SUBSCRIBER_PASSWORD: ${SUBSCRIBER_PASSWORD:-}
    TEST_CLIENT_USERNAME: ${TEST_CLIENT_USERNAME:-}
    TEST_CLIENT_PASSWORD: ${TEST_CLIENT_PASSWORD:-}
    MONITOR_USERNAME: ${MONITOR_USERNAME:-}
    MONITOR_PASSWORD: ${MONITOR_PASSWORD:-}
    MQTT_HOST: broker
    MQTT_PORT: "1883"
    RUN_ID: ${RUN_ID:-manual}
  volumes:
    - ./data/raw:/artifacts
  networks:
    - lab
  depends_on:
    - broker
  user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
  read_only: true
  tmpfs:
    - /tmp

services:
  broker:
    image: eclipse-mosquitto:2.1.2-alpine
    volumes:
      - ./config/mosquitto:/mosquitto/config:ro
    networks:
      - lab
    security_opt:
      - no-new-privileges:true

  broker_tls:
    image: eclipse-mosquitto:2.1.2-alpine
    command: ["mosquitto", "-c", "/mosquitto/config/mosquitto-tls.conf"]
    volumes:
      - ./config/mosquitto:/mosquitto/config:ro
    networks:
      - lab
    security_opt:
      - no-new-privileges:true

  subscriber:
    <<: *client
    command: ["python", "-m", "lab_clients.subscriber"]

  test_client:
    <<: *client
    volumes:
      - ./config/mosquitto/certs/ca.crt:/certs/ca.crt:ro
    command: ["python", "-m", "lab_clients.test_client", "probe"]

  capture:
    build:
      context: .
      dockerfile: docker/capture/Dockerfile
    image: mqtt-lab-capture:phase1
    network_mode: service:broker
    depends_on:
      - broker
    environment:
      RUN_ID: ${RUN_ID:-manual}
    volumes:
      - ./data/raw:/artifacts
    cap_drop:
      - ALL
    cap_add:
      - NET_RAW
      - DAC_OVERRIDE
    security_opt:
      - no-new-privileges:true
    command:
      - sh
      - -c
      - exec tcpdump -i eth0 -p -Z root -s 0 -U -w "/artifacts/$${RUN_ID}/baseline.pcap" 'tcp port 1883'

  dashboard:
    profiles: [dashboard]
    build:
      context: .
      dockerfile: docker/dashboard/Dockerfile
    image: mqtt-lab-dashboard:phase1
    environment:
      MQTT_HOST: broker
      MQTT_PORT: "1883"
      MQTT_TLS_HOST: broker_tls
      MQTT_TLS_PORT: "8883"
      MQTT_TLS_CA: /certs/ca.crt
      MQTT_USERNAME: ${MONITOR_USERNAME:-monitor}
      MQTT_PASSWORD: ${MONITOR_PASSWORD:?Run ./lab.sh init (or .\lab.ps1 init) first}
    volumes:
      - ./config/mosquitto/certs/ca.crt:/certs/ca.crt:ro
    networks:
      - lab
    depends_on:
      - broker
      - broker_tls
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  dashboard_proxy:
    profiles: [dashboard]
    image: nginx:1.27-alpine
    ports:
      - "127.0.0.1:${DASHBOARD_PORT:-8081}:8080"
    volumes:
      - ./dashboard/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - lab
      - dashboard_edge
    depends_on:
      - dashboard
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

networks:
  lab:
    internal: true
  dashboard_edge: {}

