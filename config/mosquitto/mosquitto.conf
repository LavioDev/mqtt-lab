listener 1883 0.0.0.0

listener 8883 0.0.0.0
cafile /mosquitto/config/auth/tls/ca.crt
certfile /mosquitto/config/auth/tls/server.crt
keyfile /mosquitto/config/auth/tls/server.key
tls_version tlsv1.2

allow_anonymous false
persistence false
connection_messages true
log_dest stdout
log_type all
log_timestamp true
sys_interval 5

global_plugin /usr/lib/mosquitto_password_file.so
plugin_opt_password_file /mosquitto/config/auth/passwords

global_plugin /usr/lib/mosquitto_acl_file.so
plugin_opt_acl_file /mosquitto/config/auth/acl.conf

